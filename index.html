<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nova</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#16181c">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --fond: #16181c;
    --panneau: #1e2127;
    --bulle-moi: #3a5a78;
    --bulle-ia: #262a32;
    --texte: #e8e8e6;
    --texte-att: #8b8f98;
    --accent: #e8a33d;
    --erreur: #d4654a;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  :root[data-theme="clair"] {
    --fond: #f4f4f2;
    --panneau: #ffffff;
    --bulle-moi: #4a7098;
    --bulle-ia: #e7e7e4;
    --texte: #1c1e22;
    --texte-att: #6a6e78;
  }
  * { box-sizing: border-box; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    height: 100%;
    margin: 0;
    background: var(--fond);
    color: var(--texte);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    transition: background 0.2s, color 0.2s;
  }

  header {
    padding: 12px 16px;
    padding-top: calc(12px + env(safe-area-inset-top, 0px));
    background: var(--panneau);
    border-bottom: 1px solid #2c303840;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .avatar {
    width: 34px; height: 34px; border-radius: 50%;
    background: var(--accent); color: #1a1a1a;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 15px; flex-shrink: 0;
  }
  .entete-textes { flex: 1; min-width: 0; }
  header h1 { font-size: 16px; font-weight: 600; margin: 0; letter-spacing: 0.2px; }
  header .statut { font-size: 11px; color: var(--texte-att); }
  header .icone-bouton { background: none; border: none; color: var(--texte-att); font-size: 18px; padding: 6px 8px; }

  #menu-options {
    position: fixed;
    top: calc(58px + env(safe-area-inset-top, 0px));
    right: 10px;
    background: var(--panneau);
    border: 1px solid #33384240;
    border-radius: 12px;
    overflow: hidden;
    z-index: 20;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  #menu-options button {
    display: block; width: 100%; text-align: left;
    padding: 12px 16px; background: none; border: none;
    color: var(--texte); font-size: 14px; white-space: nowrap;
  }
  #menu-options button:active { background: #80808022; }

  #fil { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg {
    max-width: 82%; padding: 10px 14px; border-radius: 14px;
    line-height: 1.45; font-size: 15px; white-space: pre-wrap; word-wrap: break-word;
    animation: apparition 0.15s ease-out;
  }
  @keyframes apparition { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  .moi { align-self: flex-end; background: var(--bulle-moi); color: #fff; border-bottom-right-radius: 4px; }
  .ia { align-self: flex-start; background: var(--bulle-ia); border-bottom-left-radius: 4px; }
  .erreur { align-self: center; color: var(--erreur); font-size: 13px; text-align: center; }
  .vide { margin: auto; text-align: center; color: var(--texte-att); font-size: 14px; padding: 0 30px; }
  .suggestions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 18px; padding: 0 10px; }
  .suggestion { background: var(--panneau); border: 1px solid #33384280; color: var(--texte); padding: 9px 14px; border-radius: 16px; font-size: 13px; }
  .suggestion:active { background: var(--accent); color: #1a1a1a; }

  .points-attente { display: inline-flex; gap: 4px; padding: 4px 0; }
  .points-attente span { width: 6px; height: 6px; border-radius: 50%; background: var(--texte-att); animation: rebond 1.2s infinite ease-in-out; }
  .points-attente span:nth-child(2) { animation-delay: 0.15s; }
  .points-attente span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes rebond { 0%, 60%, 100% { transform: translateY(0); opacity: 0.4; } 30% { transform: translateY(-4px); opacity: 1; } }

  form {
    display: flex; gap: 8px; padding: 10px 12px;
    padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
    background: var(--panneau); border-top: 1px solid #2c303840;
  }
  textarea {
    flex: 1; resize: none; background: var(--fond); border: 1px solid #33384280;
    border-radius: 18px; color: var(--texte); padding: 10px 14px;
    font-size: 15px; font-family: inherit; max-height: 100px;
  }
  textarea:focus { outline: 2px solid var(--accent); }
  button.envoyer {
    background: var(--accent); color: #1a1a1a; border: none; border-radius: 50%;
    width: 42px; height: 42px; font-size: 18px; flex-shrink: 0;
  }
  button.envoyer:disabled { opacity: 0.4; }

  #config {
    position: fixed; inset: 0; background: var(--fond);
    display: flex; flex-direction: column; justify-content: center;
    padding: 30px 26px; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
    overflow-y: auto;
  }
  #config .avatar-grand {
    width: 56px; height: 56px; border-radius: 50%; background: var(--accent); color: #1a1a1a;
    display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 24px; margin-bottom: 16px;
  }
  #config h2 { font-size: 20px; margin-bottom: 6px; }
  #config p { color: var(--texte-att); font-size: 14px; line-height: 1.5; margin-bottom: 20px; }
  #config input {
    width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid #33384280;
    background: var(--panneau); color: var(--texte); font-size: 15px; margin-bottom: 14px;
  }
  #config button {
    width: 100%; padding: 12px; border-radius: 10px; border: none;
    background: var(--accent); color: #1a1a1a; font-weight: 600; font-size: 15px;
  }
  #config a { color: var(--accent); }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div id="config">
  <div class="avatar-grand">N</div>
  <h2>Ton assistant</h2>
  <p>Colle ta clé API <strong>Groq</strong> (gratuite, sans carte bancaire). Obtiens-la sur
     <a href="https://console.groq.com/keys" target="_blank">console.groq.com/keys</a> → "Create API Key".
     Elle reste uniquement sur ton téléphone, jamais envoyée ailleurs.</p>
  <input id="champ-nom" type="text" value="Nova" placeholder="Nom de ton assistant">
  <input id="champ-cle" type="password" placeholder="gsk_...">
  <button onclick="enregistrerCle()">Commencer</button>
</div>

<header class="hidden" id="entete">
  <div class="avatar" id="avatar-entete">N</div>
  <div class="entete-textes">
    <h1 id="titre-entete">Nova</h1>
    <div class="statut">En ligne</div>
  </div>
  <button class="icone-bouton" onclick="basculerMenu()">⋮</button>
</header>

<div id="menu-options" class="hidden">
  <button onclick="nouvelleConversation()">🗨️ Nouvelle conversation</button>
  <button onclick="basculerTheme()">🌓 Changer de thème</button>
  <button onclick="reinitialiser()">🔑 Changer de clé</button>
</div>

<div id="fil" class="hidden"></div>

<form class="hidden" id="formulaire" onsubmit="return envoyer(event)">
  <textarea id="champ-message" rows="1" placeholder="Écris un message…"></textarea>
  <button class="envoyer" type="submit">↑</button>
</form>

<script>
const MODEL = "llama-3.3-70b-versatile";
const URL_API = "https://api.groq.com/openai/v1/chat/completions";

let historique = JSON.parse(localStorage.getItem("historique_nova_groq") || "[]"); // format OpenAI: {role, content, ...}
let cleAPI = localStorage.getItem("cle_groq") || "";
let nomAssistant = localStorage.getItem("nom_assistant") || "Nova";
let rappels = JSON.parse(localStorage.getItem("rappels_nova") || "[]");

const config = document.getElementById("config");
const entete = document.getElementById("entete");
const fil = document.getElementById("fil");
const formulaire = document.getElementById("formulaire");
const champMessage = document.getElementById("champ-message");
const menuOptions = document.getElementById("menu-options");

// ---------- Thème ----------
function appliquerTheme() {
  const theme = localStorage.getItem("theme_nova") || "sombre";
  document.documentElement.setAttribute("data-theme", theme === "clair" ? "clair" : "sombre");
}
function basculerTheme() {
  basculerMenu();
  const actuel = localStorage.getItem("theme_nova") || "sombre";
  const nouveau = actuel === "clair" ? "sombre" : "clair";
  try { localStorage.setItem("theme_nova", nouveau); } catch (e) {}
  appliquerTheme();
}
appliquerTheme();

function vibrer(duree) { try { if (navigator.vibrate) navigator.vibrate(duree); } catch (e) {} }

// ---------- Outils ----------
function calculer(expression) {
  const autorises = /^[0-9+\-*/(). ]+$/;
  if (!autorises.test(expression)) return "Erreur : expression invalide.";
  try { return String(Function('"use strict"; return (' + expression + ')')()); }
  catch (e) { return "Erreur de calcul."; }
}

async function rechercheWeb(requete) {
  try {
    const reponse = await fetch("https://api.duckduckgo.com/?q=" + encodeURIComponent(requete) + "&format=json&no_html=1");
    const donnees = await reponse.json();
    let resume = donnees.AbstractText || "";
    if (!resume && donnees.RelatedTopics?.length) {
      resume = donnees.RelatedTopics.slice(0, 3).map(s => s.Text).filter(Boolean).join(" | ");
    }
    return resume || "Aucun résultat trouvé.";
  } catch (e) { return "Erreur de recherche web."; }
}

async function meteo(ville) {
  try {
    const geo = await fetch("https://geocoding-api.open-meteo.com/v1/search?name=" + encodeURIComponent(ville) + "&count=1&language=fr").then(r => r.json());
    const lieu = geo.results?.[0];
    if (!lieu) return "Ville introuvable.";
    const donnees = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lieu.latitude}&longitude=${lieu.longitude}&current=temperature_2m,weather_code,wind_speed_10m`).then(r => r.json());
    const c = donnees.current;
    return `${lieu.name}: ${c.temperature_2m}°C, vent ${c.wind_speed_10m} km/h.`;
  } catch (e) { return "Erreur météo."; }
}

function ajouterRappel(texte, dansMinutes) {
  const echeance = Date.now() + Number(dansMinutes) * 60000;
  rappels.push({ texte, echeance, fait: false });
  try { localStorage.setItem("rappels_nova", JSON.stringify(rappels)); } catch (e) {}
  return `Rappel noté : "${texte}" dans ${dansMinutes} minute(s). (Nova doit rester ouverte en arrière-plan.)`;
}

setInterval(() => {
  const maintenant = Date.now();
  let modifie = false;
  for (const r of rappels) {
    if (!r.fait && r.echeance <= maintenant) {
      r.fait = true; modifie = true;
      vibrer([200, 100, 200]);
      ajouterBulle("⏰ Rappel : " + r.texte, "ia");
    }
  }
  if (modifie) { try { localStorage.setItem("rappels_nova", JSON.stringify(rappels)); } catch (e) {} }
}, 15000);

// Format OpenAI/Groq pour les outils
const OUTILS = [
  {
    type: "function",
    function: {
      name: "calculer",
      description: "Calcule une expression mathématique, ex: '12 * (3 + 4)'.",
      parameters: { type: "object", properties: { expression: { type: "string" } }, required: ["expression"] }
    }
  },
  {
    type: "function",
    function: {
      name: "rechercheWeb",
      description: "Cherche une information récente ou factuelle sur le web.",
      parameters: { type: "object", properties: { requete: { type: "string" } }, required: ["requete"] }
    }
  },
  {
    type: "function",
    function: {
      name: "meteo",
      description: "Donne la météo actuelle d'une ville.",
      parameters: { type: "object", properties: { ville: { type: "string" } }, required: ["ville"] }
    }
  },
  {
    type: "function",
    function: {
      name: "ajouterRappel",
      description: "Programme un rappel pour dans X minutes, tant que l'app reste ouverte.",
      parameters: { type: "object", properties: { texte: { type: "string" }, dansMinutes: { type: "number" } }, required: ["texte", "dansMinutes"] }
    }
  }
];

async function executerOutil(nom, args) {
  if (nom === "calculer") return calculer(args.expression);
  if (nom === "rechercheWeb") return await rechercheWeb(args.requete);
  if (nom === "meteo") return await meteo(args.ville);
  if (nom === "ajouterRappel") return ajouterRappel(args.texte, args.dansMinutes);
  return "Outil inconnu.";
}

// ---------- Interface ----------
function demarrer() {
  config.classList.add("hidden");
  entete.classList.remove("hidden");
  fil.classList.remove("hidden");
  formulaire.classList.remove("hidden");
  document.getElementById("titre-entete").textContent = nomAssistant;
  document.getElementById("avatar-entete").textContent = nomAssistant.charAt(0).toUpperCase();
  reconstruireFil();
}

function reconstruireFil() {
  fil.innerHTML = "";
  const visibles = historique.filter(m => (m.role === "user" || m.role === "assistant") && typeof m.content === "string" && m.content);
  if (visibles.length === 0) { afficherVide(); return; }
  for (const m of visibles) ajouterBulle(m.content, m.role === "user" ? "moi" : "ia");
}

function afficherVide() {
  const suggestions = [
    "Quel temps fait-il à Dakar ?",
    "Combien font 47 × 23 ?",
    "Rappelle-moi de boire de l'eau dans 15 minutes",
    "Raconte-moi une blague"
  ];
  fil.innerHTML = `
    <div class="vide">
      Pose ta première question pour commencer, ou essaie :
      <div class="suggestions">
        ${suggestions.map(s => `<button class="suggestion" onclick="envoyerSuggestion(this)">${s}</button>`).join("")}
      </div>
    </div>`;
}
function envoyerSuggestion(bouton) {
  champMessage.value = bouton.textContent;
  formulaire.requestSubmit();
}

function sauvegarderHistorique() {
  try { localStorage.setItem("historique_nova_groq", JSON.stringify(historique.slice(-60))); } catch (e) {}
}

function nouvelleConversation() {
  basculerMenu();
  historique = [];
  sauvegarderHistorique();
  afficherVide();
}

function basculerMenu() { menuOptions.classList.toggle("hidden"); }
document.addEventListener("click", (e) => {
  if (!menuOptions.classList.contains("hidden") && !e.target.closest("#entete") && !e.target.closest("#menu-options")) {
    menuOptions.classList.add("hidden");
  }
});

function enregistrerCle() {
  const valeur = document.getElementById("champ-cle").value.trim();
  const nom = document.getElementById("champ-nom").value.trim() || "Nova";
  if (!valeur) return;
  try {
    localStorage.setItem("cle_groq", valeur);
    localStorage.setItem("nom_assistant", nom);
  } catch (e) {}
  cleAPI = valeur;
  nomAssistant = nom;
  demarrer();
}

function reinitialiser() {
  basculerMenu();
  try { localStorage.removeItem("cle_groq"); } catch (e) {}
  cleAPI = "";
  entete.classList.add("hidden");
  fil.classList.add("hidden");
  formulaire.classList.add("hidden");
  config.classList.remove("hidden");
}

function ajouterBulle(texte, classe) {
  const vide = fil.querySelector(".vide");
  if (vide) vide.remove();
  const bulle = document.createElement("div");
  bulle.className = "msg " + classe;
  bulle.textContent = texte;
  fil.appendChild(bulle);
  fil.scrollTop = fil.scrollHeight;
  return bulle;
}

function ajouterIndicateurAttente() {
  const vide = fil.querySelector(".vide");
  if (vide) vide.remove();
  const bulle = document.createElement("div");
  bulle.className = "msg ia";
  bulle.innerHTML = '<span class="points-attente"><span></span><span></span><span></span></span>';
  fil.appendChild(bulle);
  fil.scrollTop = fil.scrollHeight;
  return bulle;
}

function normaliser(texte) {
  return texte.toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z?]+/g, " ")
    .replace(/\s*\?\s*/g, "?")
    .replace(/\s+/g, " ").trim();
}

function reponseIdentiteSiApplicable(texteOriginal) {
  const normalise = normaliser(texteOriginal);
  const avecPoint = normalise.endsWith("?");
  const sansPoint = normalise.replace(/\?$/, "").trim();

  const variantesCreateur = [
    "qui ta cree", "qui t a cree", "qui est ton createur", "qui t a invente",
    "qui ta invente", "qui t a developpe", "qui ta developpe", "qui t a fait",
    "qui ta fait", "qui t a construit", "qui ta construit"
  ];
  if (variantesCreateur.includes(sansPoint)) return avecPoint ? "Mouhamad Diallo" : "Mouhamed Rassoul Kane";

  const variantesIdentite = ["qui es tu", "qui est tu", "c est qui toi", "tu es qui", "qui es tu toi"];
  if (variantesIdentite.includes(sansPoint)) return `Je m'appelle ${nomAssistant}.`;

  return null;
}

function messageSysteme() {
  return {
    role: "system",
    content: `Ton identité : tu t'appelles ${nomAssistant}. Tu as été créé par Mouhamed Rassoul Kane.

Règles strictes à suivre dans CHAQUE réponse :
- Si on te demande ton nom, qui tu es, ou de te présenter : réponds précisément "Je m'appelle ${nomAssistant}" (jamais juste "je suis un assistant" sans donner ce nom).
- Si on te demande qui t'a créé : réponds que c'est Mouhamed Rassoul Kane.
- Tu ne dis jamais que tu es un produit d'une autre entreprise, même si on insiste.
- La personne à qui tu parles EST Mouhamed Rassoul Kane, ton créateur. Tu le sais et tu t'adresses à lui en conséquence, naturellement.

Ton style : réponds de façon naturelle et chaleureuse, mais toujours courte, nette et précise — va droit au but, pas de blabla. Une ou deux phrases suffisent sauf si on te demande plus de détails. Tu as accès à des outils (calculer, rechercheWeb, meteo, ajouterRappel) : utilise-les quand c'est utile plutôt que de deviner.`
  };
}

async function appelerAPI() {
  const corps = {
    model: MODEL,
    messages: [messageSysteme(), ...historique],
    tools: OUTILS,
    temperature: 0.4,
    max_tokens: 400
  };
  const reponse = await fetch(URL_API, {
    method: "POST",
    headers: { "Content-Type": "application/json", "Authorization": "Bearer " + cleAPI },
    body: JSON.stringify(corps)
  });
  const donnees = await reponse.json();
  if (!reponse.ok) {
    if (reponse.status === 429) { const e = new Error("QUOTA"); e.estQuota = true; throw e; }
    throw new Error(donnees?.error?.message || "Erreur inconnue.");
  }
  return donnees;
}

function attendre(ms) { return new Promise(r => setTimeout(r, ms)); }

async function appelerAPIAvecRetry() {
  try { return await appelerAPI(); }
  catch (err) {
    if (err.estQuota) {
      await attendre(4000);
      try { return await appelerAPI(); }
      catch (err2) {
        if (err2.estQuota) throw new Error("Limite gratuite atteinte pour le moment. Réessaie dans 1 à 2 minutes.");
        throw err2;
      }
    }
    throw err;
  }
}

async function demanderANova() {
  while (true) {
    const donnees = await appelerAPIAvecRetry();
    const choix = donnees.choices?.[0]?.message;
    if (!choix) return "(réponse vide)";

    if (choix.tool_calls && choix.tool_calls.length > 0) {
      historique.push({ role: "assistant", content: choix.content || null, tool_calls: choix.tool_calls });
      for (const appel of choix.tool_calls) {
        let args = {};
        try { args = JSON.parse(appel.function.arguments || "{}"); } catch (e) {}
        const resultat = await executerOutil(appel.function.name, args);
        historique.push({ role: "tool", tool_call_id: appel.id, content: String(resultat) });
      }
      continue;
    }

    const texte = choix.content || "";
    historique.push({ role: "assistant", content: texte });
    return texte;
  }
}

async function envoyer(e) {
  e.preventDefault();
  const texte = champMessage.value.trim();
  if (!texte) return false;

  champMessage.value = "";
  champMessage.style.height = "auto";
  ajouterBulle(texte, "moi");
  vibrer(15);

  const reponseFixe = reponseIdentiteSiApplicable(texte);
  if (reponseFixe !== null) {
    historique.push({ role: "user", content: texte });
    ajouterBulle(reponseFixe, "ia");
    historique.push({ role: "assistant", content: reponseFixe });
    sauvegarderHistorique();
    return false;
  }

  historique.push({ role: "user", content: texte });
  const bulleAttente = ajouterIndicateurAttente();

  try {
    const reponseTexte = await demanderANova();
    bulleAttente.textContent = reponseTexte || "(réponse vide)";
    vibrer(10);
    sauvegarderHistorique();
  } catch (err) {
    bulleAttente.remove();
    ajouterBulle("Erreur : " + err.message, "erreur");
    historique.pop();
  }
  fil.scrollTop = fil.scrollHeight;
  return false;
}

champMessage.addEventListener("input", () => {
  champMessage.style.height = "auto";
  champMessage.style.height = champMessage.scrollHeight + "px";
});
champMessage.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); formulaire.requestSubmit(); }
});

if (cleAPI) demarrer();
</script>
</body>
</html>
